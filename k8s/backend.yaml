
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: q66
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: anusha7125/q66-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/merndb"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: q66
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
