
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: q66
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: anusha7125/q66-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
